name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      ANSWER_PROVIDER: none
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked, CPU-only torch)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Mocked tests only: no model download, no Anthropic calls (live/model markers excluded by default).
      - name: Tests + coverage
        run: uv run pytest
