[project]
name = "medical-record-query"
version = "0.1.0"
description = "On-premise semantic search API over synthetic patient records (FastAPI + ChromaDB + bge-large)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.0",
    "instructor>=1.17.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false

# CPU-only torch on every platform (avoids multi-GB CUDA wheels in Docker/Linux).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "faker>=40.44.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".hf_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "PL"]
ignore = [
    "PLR0913",  # services legitimately take several collaborators
    "PLR2004",  # magic values are fine in tests/scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"scripts/**" = ["S311", "PLC0415", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*", "instructor.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live and not model'"
markers = [
    "live: real Anthropic API calls (budget-capped; run with -m live --no-cov)",
    "model: real bge embedding model (downloads ~1.3 GB once; run with -m model --no-cov)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
